# ── الموضوعات الرائجة (Google Trends) ───────────────────────
# إشارة *الطلب*: ما يبحث عنه الناس فعلًا، لا ما تنشره الوكالات.
# الخبر الذي تغطيه عدة وكالات ويطابق موضوعًا رائجًا يتصدر الترتيب.
trends:
  enabled: true
  # 8.0 لا 4.0: مؤشر "كم وكالة غطّته" يعاقب الأخبار الخفيفة أصلًا —
  # الغرائب تنشرها مواقع قليلة لكنها تنتشر بجنون. الترند يصحّح ذلك.
  weight: 8.0
  # ⚠️ هذه دول *جمهورك* لا دول مصادرك. المصادر تحدد من أين تأتي الأخبار،
  # والترند يحدد ما يهتم به قراؤك — وهم عرب.
  geos: ["EG", "SA", "AE", "MA", "DZ", "IQ", "JO", "KW", "TN", "LY", "YE", "QA", "OM"]

# ── الترشيح والترتيب ────────────────────────────────────────
selection:
  max_age_hours: 30          # نافذة أوسع للقصص بطيئة الاشتعال
  drafts_per_run: 3
  # حصص كل دفعة: ثلثان خفيف/رياضة، وثلث جاد.
  # عدّل الأرقام لتغيير هوية الصفحة. احذف القسم لإلغاء الحصص.
  # دفعة من خمسة: غرابتان + رياضة + نافع + جاد.
  # رفعنا الخفيف إلى اثنين، ولو أبقينا الدفعة عند أربعة لسقط الجاد
  # من الحصص كليًا. لتعود إلى أربعة: اجعل serious: 0 و drafts_per_run: 4
  # — عندها يظهر الجاد فقط حين تعجز التصنيفات الأخرى عن ملء فتحاتها.
  # ── متى تُفرَض الحصص؟ ──
  # الأصل أن الأعلى مؤشرًا يفوز دائمًا. الحصص لا تُفعَّل إلا حين يهبط
  # أفضل مرشح عن نصف ذروة اليوم — أي حين يفقر اليوم إخباريًا فيصبح
  # التنويع أجدى من نشر أقوى الموجود وهو كله من تصنيف واحد.
  # قرار متعمَّد (issue #277): يبقى هذا السلوك كما هو — الحصص للأيام
  # الضعيفة فقط، والترند وحده يفوز في الأيام القوية بلا أي تدخل تصنيفي.
  peak_window_hours: 24      # نافذة حساب الذروة
  quota_trigger_ratio: 0.5   # 0.5 = النصف · ارفعه لتنويع أكثر
  quotas:
    light: 1      # غرائب وطرائف وثقافة وطعام
    useful: 1     # صحة، تقنية، اقتصاد شخصي، هجرة
    serious: 1    # سياسة واقتصاد كلي
    sport: 0      # رياضة — تُملأ من المؤجَّل حين تعجز البقية          # عدد المسودات المولّدة في كل تشغيل
  min_sources_for_trend: 1   # ارفعه إلى 2 لنشر ما تتفق عليه عدة مصادر فقط
  dedupe_memory_days: 5      # لا تعد نشر خبر مشابه خلال هذه المدة
  # هذا الحد لتجميع cluster() فقط: نسخ الخبر نفسه من مصادر متعددة في
  # التشغيلة الواحدة، حيث الصياغات متقاربة زمنيًا ولغويًا (غالبًا نفس
  # وكالة الأنباء) فتشابهها اللفظي مرتفع طبيعيًا. عتبة صارمة هنا مقصودة
  # لتفادي دمج خبرين مختلفين يتشاركان كيانًا فقط. لا تُستخدم لمقارنة
  # ذاكرة النشر عبر تشغيلات متباعدة — انظر dedupe_title_similarity تحت.
  title_similarity: 0.62     # حد التشابه لدمج نفس الخبر من مصادر مختلفة (0-1)
  # هذا الحد لذاكرة التكرار عبر التشغيلات (store.find_previous) فقط:
  # نفس الحدث يُعاد نشره بصياغة عنوان مختلفة تمامًا بين تشغيلة وأخرى
  # (أفعال مختلفة، ترتيب مختلف، تفاصيل إضافية كعدد الضحايا) فتشابهه
  # اللفظي أخفض بكثير من نسخ نفس اللحظة. عيّنة حقيقية من الإنتاج (Issue
  # #274): ثلاث صياغات لحادثة تايلاند بتشابه 0.571/0.428/0.556 — تحت
  # 0.62 فتفوت حارس التكرار وتُرفض لاحقًا يدويًا كمكررة. 0.5 مقاربة
  # لعتبة verify.title_similarity (0.45) المستخدمة لنفس الغرض هناك.
  dedupe_title_similarity: 0.5
  screen_per_draft: 8        # كم مرشحًا يُفرز لكل مسودة مطلوبة
  screen_horizon_max: 90     # سقف الفرز مهما ارتفع المطلوب
  # تناوب المناطق: «الخفيف» يضم غرائب وطعامًا وثقافة وآثارًا بفتحة واحدة.
  # بلا تناوب يبتلع أقواها كل الفتحات. الرقم = كم مسودة أخيرة تُستبعد
  # مناطقها. 6 يعني: لا تكرر منطقة ظهرت في آخر ست مسودات.
  region_cooldown: 6
  velocity_track_top: 250    # قياس السرعة للمتصدّرين فقط (يمنع تضخّم الحالة)
  velocity_weight: 5.0       # وزن *سرعة* الانتشار — أهم إشارة ترند حقيقية
  allow_followups: true      # اسمح بمنشور ثانٍ إن حمل تطورًا جديدًا فعليًا
  followup_min_hours: 10     # أقل فاصل بين منشورين عن الحدث نفسه
  region_diversity: true     # وزّع الأخبار جغرافيًا بدل تكديسها من منطقة واحدة
  max_per_region: 2          # سقف الأخبار من نفس المنطقة في الدفعة الواحدة
  blocklist_keywords:        # كلمات تستبعد الخبر تمامًا
    - "horoscope"
    - "betting odds"
    - "sponsored"

# ── الاختيار قبل الصياغة (توفير الإنفاق — Issue #280) ────────
# بديل لدورة "صُغ ثم راجِع" الحالية لا إضافة إليها: حين enabled: true،
# collect.py يتوقف بعد الترتيب والفرز (Haiku رخيص أصلًا) ويفتح Issue
# بعناوين خام بلا صياغة عربية ولا صورة ولا استدعاء Sonnet — فتُدفع تكلفة
# الصياغة والصورة فقط لما تختاره فعلًا لا لما يُرفض لاحقًا في المراجعة.
# اجعله false للعودة إلى الدورة القديمة (صياغة كل الدفعة ثم مراجعتها).
preselect:
  enabled: true
  candidates_per_run: 5
  # ترجمة عربية مختصرة لعنوان كل مرشح في Issue الاختيار (Issue #319) —
  # استدعاء Haiku واحد للدفعة كلها معًا، لا لكل عنوان. تخص مرشحي collect
  # والرادار معًا (تُستدعى مرة واحدة على القائمة المدموجة في open_review.py).
  translate:
    enabled: true
    model: "claude-haiku-4-5-20251001"
    # عنوان بنسبة أحرف عربية فوق هذه العتبة يُعدّ عربيًا أصلًا فلا يُرسَل
    # للترجمة — توفير إضافي. 0.4 يكفي لتمييز عنوان عربي مكتوب فعلًا حتى
    # مع وجود أرقام/أسماء أعلام لاتينية داخله.
    arabic_skip_ratio: 0.4

# ── الصياغة العربية (Claude API) ────────────────────────────
writer:
  model: "claude-sonnet-5"   # بديل أرخص: claude-haiku-4-5-20251001
  max_tokens: 3000           # سقف الرد — أقل منه يبتر المخرجات ويهدر المال
  tone: "خبري رصين، عربي فصيح مبسّط، بلا مبالغة أو إثارة"
  post_length: "60 إلى 90 كلمة"
  # ── فقرة «خلف الخبر» ──
  # عنوان الفقرة التحليلية أسفل المتن. اجعله "" لإخفاء العنوان تمامًا.
  analysis_header: "خلف الخبر"
  # سقف الطول. الطول الفعلي يتبع ما وجده النموذج في المصادر: قد يكون
  # جملتين، وقد لا تُكتب الفقرة أصلًا إن كانت المصادر خبرية بلا تحليل.
  analysis_max_words: 120
  hashtags_count: 4
  # المصادر تُكتب على الصورة في تذييلها، وتتكرر في التعليق الأول مع
  # الرابط. ذكرها ثالثةً في المتن حشو يزاحم النص. اجعله true لإعادتها.
  include_source_credit: false

# ── الطلبات اليدوية ────────────────────────────────────────
# أنت تعطي الكلمات، والبوت يبحث عنها ويصوغ منها خبرًا. عكس الدورة
# العادية التي تلتقط ما يتصدّر الخلاصات وحده.
#   Actions → «طلب خبر بكلمات» → اكتب في الخانة → Run
request:
  days: 7              # نافذة البحث الافتراضية بالأيام
  # كم كلمة من طلبك يجب أن تظهر في الخبر ليُعدّ مطابقًا. ارفعها إلى 2
  # إن جاءتك نتائج مجاورة للموضوع لا فيه.
  min_matches: 1
  # لغات البحث. العربية تلتقط الإعلام العربي، والإنجليزية تلتقط
  # الوكالات الدولية — والاثنتان معًا أوسع تغطية من أيهما وحدها.
  locales:
    - {hl: "ar", gl: "EG", ceid: "EG:ar"}
    - {hl: "en-US", gl: "US", ceid: "US:en"}

# ── التحقق من مقال ملصق (Issue بوسم "تحقق") ─────────────────
# المرحلة الأولى فقط: بحث وتقرير، بلا صياغة منشور. يستخرج ادعاءات المقال
# الملصق ويبحث عن كل واحدة عبر مصادر مستقلة قبل الحكم عليها — أعد استخدام
# آلية بحث request.py وقراءة extract.py، لا منطقًا جديدًا.
verify:
  model: "claude-sonnet-5"   # استخراج البنية والحكم على الوقائع تحليل لا فرز آلي
  extract_max_tokens: 4000  # مقال طويل قد يستخرج منه عشرات الوقائع/الأسئلة —
  # writer.max_tokens (3000) لمهمة أخف (منشور واحد لا بنية مقال كامل)
  days: 21                   # نافذة البحث عن كل واقعة وسؤال؛ 14 كانت تُسقط
  # وقائع عن وقائع أواخر الشهر الماضي (when:Nd يُقاس من تاريخ التشغيل، ومقال
  # ملصق قد يصل بعد أيام من الحدث نفسه) — Issue #132 تعليق لاحق
  min_confirm_sources: 2     # أقل عدد مصادر مستقلة مؤيّدة لتصبح الواقعة "مؤكَّدة"
  # أعلى من reading.max_sources: هذا مسار تحليلي يقارن رواية بمصادر مستقلة،
  # لا صياغة تكتفي بمصدر واحد للوقائع.
  near_confirm_min_weight: 0.65  # العلاج 4 (Issue #132 تعليق لاحق): عتبة وزن
  # الناشر لعرض واقعة بمصدر واحد كـ"شبه مؤكَّدة — مصدر واحد قوي" بدل "مصدر
  # واحد" المبهمة — تفرّق بين مصدر معروف في sources/trusted_boost ومصدر
  # مجهول وحده (الوزن الافتراضي 0.6 دون هذه القيمة). لا تغيّر الحكم النهائي
  # (يبقى يتطلب min_confirm_sources مصادر فعلية ليصبح "نعم")، تكشف عدم
  # اليقين في التقرير فقط بدل إخفائه.
  # القيمة 1.0 السابقة لم تكن واقعية (Issue #132 تعليق لاحق تالٍ): أوزان
  # sources أعلاه تتوزّع فعليًا بين 0.7 و1.3 — عتبة 1.0 كانت تستبعد أكثر من
  # نصف مصادر sources المُدرَجة فعليًا (كل ما وزنه 0.7-0.9) فتعاملها كناشر
  # مجهول تمامًا. 0.65 تقع بين الوزن الافتراضي للمجهول (0.6) وأدنى وزن
  # مُدرَج فعليًا (0.7)، فتفرّق بدقة بين "معروف" و"مجهول تمامًا" بصرف النظر
  # عن مدى ارتفاع وزن المصدر المعروف.
  read_per_claim: 3
  max_claims: 8              # سقف عدد الوقائع المفحوصة — كل واقعة بحث + قراءة + حكم
  max_questions: 5           # سقف عدد الأسئلة المبحوثة
  query_max_words: 5         # استعلام البحث كلمات مفتاحية لا الادّعاء كاملًا —
  # جملة طويلة لا تُطابق أي نتيجة في بحث Google News (Issue #132 تعليق لاحق)
  bilingual_cluster: true    # rank.cluster تستعمل request.norm_tokens (عربي+
  # إنجليزي) بدل rank.tokens (لاتيني فقط، عمدًا كذلك لمسار الجمع الأساسي
  # الذي خلاصاته إنجليزية) — بلا هذا، عنوانان عربيان مستقلا الصياغة عن
  # الحدث نفسه لا يشتركان في أي توقيع لاتيني فيبقيان مجموعتين منفصلتين
  # (Issue #132 تعليق لاحق)
  title_similarity: 0.45     # حد تشابه أخفض من selection.title_similarity
  # (0.62، مضبوط لنسخ شبه متطابقة من وكالة واحدة): صياغتان عربيتان مستقلتان
  # لنفس الحدث من ناشرين مختلفين لا تتجاوزان عمليًا 0.5 تشابهًا حتى بعد
  # التطبيع ثنائي اللغة — قيمة مقيسة من مثال حقيقي رُصد في الإنتاج
  locales:
    - {hl: "ar", gl: "EG", ceid: "EG:ar"}
    - {hl: "en-US", gl: "US", ceid: "US:en"}
  # وكالات وصحف كبرى تُقرأ أولًا دومًا مهما كانت صلتها اللفظية بنص الادّعاء
  # أضعف من ناشر مجهول — أغلبها غير مُدرَج في sources أعلاه أصلًا (تلك
  # مصممة لمسار الجمع لا للتحقق) فتحتاج قائمتها الخاصة هنا (Issue #132
  # تعليق لاحق: حكم إيجابي فعلي استند إلى خبرگزاری مهر والخلاصة نت وأهل مصر
  # وVietnam.vn بينما بلومبرغ نفسها ظهرت في نتائج البحث ولم تُقرأ، لأن
  # ترتيب القراءة كان بالصلة وحدها لا بموثوقية الناشر)
  trusted_boost:
    - "Reuters"
    - "Associated Press"
    - "Agence France-Presse"
    - "AFP"
    - "Bloomberg"
    - "BBC"
    - "Al Jazeera"
    - "CNN"
    - "The Guardian"
    - "The New York Times"
    - "The Washington Post"
    - "Al Arabiya"
  # مرادفات عربية لكل وكالة في trusted_boost أعلاه: الاسم الإنجليزي وحده لا
  # يطابق الاسم كما يعرضه Google News غالبًا بالعربية — 'الشرق بلومبرغ' لا
  # يطابق 'Bloomberg' حرفيًا (لا تحويل بين الأبجديتين في norm_tokens)، فتسقط
  # الوكالة للوزن الافتراضي رغم كونها بلومبرغ فعليًا (Issue #132 تعليق لاحق)
  publisher_aliases:
    Bloomberg: ["بلومبرغ", "بلومبيرغ"]
    Reuters: ["رويترز"]
    "Associated Press": ["أسوشيتد برس", "أسوشييتد برس"]
    "Agence France-Presse": ["فرانس برس", "وكالة الصحافة الفرنسية"]
    AFP: ["فرانس برس", "وكالة الصحافة الفرنسية"]
    BBC: ["بي بي سي"]
    "Al Jazeera": ["الجزيرة"]
    CNN: ["سي إن إن"]
    "The Guardian": ["الغارديان", "الجارديان"]
    "The New York Times": ["نيويورك تايمز"]
    "The Washington Post": ["واشنطن بوست"]
    "Al Arabiya": ["العربية"]
  # ناشرون يتكرر حجبهم (HTTP 403) عبر كل استعلام تقريبًا — خسارة مصدر دائمة
  # لا عارضة (تشخيص Issue #373، البند 3). يبقون مصدر إشارة صالحًا للعنوان/
  # الملخص وللترتيب العام (لا يمسّان _publisher_weight ولا trusted_boost
  # أعلاه — العربية مثلًا موثوقة كاستشهاد رغم حجبها هنا)، لكنهم يخسرون
  # أولوية فتحات القراءة النادرة (read_per_claim) في evidence.gather_evidence
  # لصالح مرشح أرجح نجاحًا بالفعل. مصدر إشارة صالح ≠ مرشح قراءة رابح.
  # Reuters هنا لسبب مختلف (HTTP 401 لا 403 — جدار اشتراك يمنع أي جالب غير
  # مسجَّل الدخول مهما كانت الرؤوس، موثَّق كنمط دائم عبر عدة تشغيلات في
  # Issue #373)، لا حل ممكن له غير خفض أولوية القراءة كسابقيه — يبقى موثوقًا
  # بوزن trusted_boost الكامل كاستشهاد ومصدر إشارة، فقط يخسر أولوية الجلب.
  # الثلاثة أدناه (رأي اليوم، نيوز رووم، alghad.tv) أُضيفت من تشخيص تجميعي
  # منفصل (Issue #583) على آخر 13 Issue موسومة `مقال` تحديدًا (لا نفس عيّنة
  # التشخيص الأصلي أعلاه): فشل الجلب (HTTP 403 أساسًا) ظهر في 7 من الـ13،
  # وعند عدّ كل نطاق فشل جلبه مرتين فأكثر عبر تلك العيّنة وحدها تحديدًا —
  # نيوز رووم 3 مرات (Issues 578، 545×2)، alghad.tv 3 مرات (545، 540، 542)،
  # رأي اليوم مرتان (574، 545) — دون سواها (كل نطاق آخر ظهر مرة واحدة فقط،
  # منها القاهرة 24 رغم ذكره سابقًا كمثال مرشّح ثانٍ ضائع في #569، لم يتكرر
  # فشله فعليًا في هذه العيّنة فلم يُضَف). نفس الآلية أعلاه بالضبط (خفض
  # أولوية القراءة لا استبعاد من الترتيب أو الاستشهاد)، لا قائمة موازية.
  demoted_readers:
    - "France 24"
    - "France24"
    - "Al Arabiya"
    - "العربية"
    - "Orient Net"
    - "أورينت نت"
    - "Reuters"
    - "رويترز"
    - "رأي اليوم"
    - "نيوز رووم"
    - "alghad.tv"
  # ناشرون غير إخباريين (رياضة/تسوق/ترفيه...) يُستبعدون كليًا كمرشّحي قراءة
  # تحقّق — قبل أي وزن (تشخيص Issue #373، البند 4): مطابقة لفظية عابرة من
  # موقع نتائج رياضية (365Scores نجا فعليًا من التصفية وقُرئ في عيّنة
  # حقيقية) ليست دليلًا صحفيًا مهما دقّت — نوع المصدر هو المشكلة لا صلته.
  excluded_publishers:
    - "365Scores"
    - "beIN Sports"
    - "Goal.com"
    - "Flashscore"
    - "ESPN"

# ── صياغة مسودة من المؤكَّد وحده (المرحلة الثانية من التحقق) ─
# بعد تقرير verify.py أعلاه: يبني src/verify_draft.py مسودة خبر من الوقائع
# المؤكَّدة بمصدرين مستقلين فأكثر وحدها — لا من المقال الملصق، ولا من
# "شبه مؤكَّدة"/"مصدر واحد". تدخل دورة المراجعة العادية (store.py →
# drafts/ → Issue) بلا مسار موازٍ. انظر src/verify_draft.py.
verify_draft:
  # واقعة واحدة مؤكَّدة نادرًا ما تحمل خبرًا قائمًا بذاته — نفس القياس الذي
  # يعامل به verify.py الإجمالي مصدرًا واحدًا كغير كافٍ للحكم الإيجابي
  min_confirmed_facts: 2
  # تتابع كلمات متتالية مشترك بهذا الطول أو أطول مع المقال الملصق أو مع
  # مقتطف مصدر مؤكِّد = نسخ → رفض المسودة بلا إعادة محاولة (مدخلات الصياغة
  # لا تتغيّر بين محاولتين، فتكرار التطابق مرجَّح لا مستبعَد). 7 أقصر من
  # عتبة verify.py الأولى (10) بعد أن استُثنيت الاقتباسات المنسوبة الموثَّقة
  # من الفحص: شبه جملة من ثماني كلمات جملة منقولة فعلًا لا تقاربًا صياغيًا
  # طبيعيًا بين نصين مستقلين
  max_shared_run_words: 7
  # إعفاءان من الرفض أعلاه لا يرفعان العتبة (تشخيص Issue #373، الجولة
  # العاشرة): تتابع ورد في مصدر واحد فقط يُعفى إن تكرر داخل نص ذلك المصدر
  # نفسه ≥ هذا العدد (اسم مؤسسة يتكرر في الخبر عنها؛ الجملة المنسوخة لا
  # تتكرر) — انظر verify_draft.check_originality وarticle.check_originality
  # (الإعفاء الثاني، ورود التتابع في وثيقة أخرى مقروءة، بلا عتبة عدد خاصة به)
  repeat_within_source_min_count: 2
  # تقليم حدّي قبل الرفض (تشخيص Issue #373، الجولة الثانية عشرة): نافذة سبع
  # كلمات فشلت الإعفاءين أعلاه بطولها الكامل («فرع الأمن السياسي في درعا
  # الذي كان») قد تحمل نواة اسم مؤسسة (5 كلمات فأكثر) يمنعها فقط ذيل نحوي من
  # الإعفاء — تُقلَّم كلمات وظيفية فقط (request._AR_STOP) من الطرفين حتى هذا
  # الحد الأدنى، وتُفحص النواة على نفس الإعفاءين بطولها المقلَّم. لا يجوز
  # تقليم كلمة مضمون مهما بلغ الرفض — انظر verify_draft._trim_exempt.
  # خُفِّض إلى 4 في تعليق الموافقة الثالث عشر ثم أُرجِع إلى 5 في تعليق
  # الموافقة الرابع عشر (محاكاة أثبتت أن الخفض لا يجدي لتلك الحالة — «لاعب
  # ريال مدريد السابق» تبقى «السابق» في أي نواة مقلَّمة، وكلمة واحدة مختلفة
  # بين مصدرين تُسقط التطابق الحرفي بصرف النظر عن طول النواة). ثم خُفِّض إلى
  # 4 من جديد (الحالة الخامسة، «هوي كا يان معروف بالصينية باسم شو» —
  # _name_link_exempt): كلمة الارتساء تقع عند الموضع الرابع من سبعة، فلا
  # يتّسع الطول من هناك حتى نهاية النافذة لأكثر من 4 كلمات — الحد الافتراضي
  # 5 لا يكفي لهذا الشكل تحديدًا، وهذا مكسب مؤكَّد بالتشغيل الفعلي لا
  # بالمحاكاة. لا نزول تحت 4 مهما ضُبط هنا: verify_draft.TRIM_MIN_CORE_FLOOR
  # يفرض هذا الحد بصرف النظر عن القيمة المُهيَّأة — بقي كما هو، حارس مستقل
  # عن قيمة هذا الإعداد
  trim_min_core: 4

# ── مقال من المصادر ──────────────────────────────────────────
# مسار «مقال من المصادر» (Issue #348): يبدأ من موجز تحريري ملصوق في الـ
# Issue (فكرة كاتبه + معلوماته + رأيه) — لا من مقال جاهز يُحاكَم كما في
# verify.py أعلاه — والمخرج مقال جديد مسنود بالمصادر يجيب عن سؤال، لا حكم
# ولا جدول أحكام. يعيد استعمال src/evidence.py (بحث/قراءة/وزن ناشر/مطابقة
# أسماء) وverify_draft.check_originality كما هما، لكنه لا يستعمل
# classify_fact/judge_fact (يجسّدان الخطأ الجوهري الموثَّق في الطلب: الحكم
# على صياغة الموجز كما وردت لا على ما يكشفه البحث) ولا writer.SYSTEM_PROMPT
# (سياسة تحريرية مستقلة عمدًا — القاعدة 6 في الطلب). انظر src/article.py.
article:
  model: "claude-sonnet-5"
  max_tokens: 3000             # سقف رد الصياغة
  extract_max_tokens: 3000     # سقف رد استخراج بنية الموجز (وقائع/آراء/أسئلة)
  days: 21                     # نافذة البحث عن كل واقعة مسندة؛ نفس افتراض verify.days
  min_confirm_sources: 2       # عدد المصادر المستقلة المؤيِّدة لتصبح الواقعة (أو إجابة سؤال) "مسندة"
  # عتبة سند مستقلة لعنصر "تقرير منقول" (نوع رابع، تشخيص Issue #373، الجولة
  # السادسة عشرة): واقعة "س فعل كذا" تحتاج مصدرين لأن الحدث وقع أو لم يقع
  # فيمكن رصده من زوايا مستقلة متعددة — أما "صحيفة/منصة س نشرت تقريرًا يقول
  # كذا" فالواقعة هي النشر نفسه، ودليله الوحيد الممكن بطبيعة الحال هو
  # المنشور ذاته أو ناقل يسمّيه؛ طلب مصدرين مستقلين هنا مطلب لن يتحقق أبدًا
  # بنيويًا لا لضعف البحث. مصدر واحد يكفي، لكن بشرط هوية مزدوج بنيوي (لا حكم
  # نموذج) — انظر article._report_identity_kind — يمنع الالتفاف بتصنيف خبر
  # عادي كـ"تقرير منقول" ليمرّ بمصدر واحد؛ عنصر بلا publisher محدَّد يعود إلى
  # "واقعة" بالعتبة العادية أعلاه (article.normalize_statement).
  report_min_confirm: 1
  # فحص بنيوي بعدي — بلاغ لا رفض (طلب المراجعة، تشخيص Issue #373، الجولة
  # السابعة عشرة، البند 2-ج): كيان (تتابع كلمات مضمون متتالية) في المتن
  # غائب عن الوقائع المسندة وعن الموجز يُبلَّغ في التقرير — لا يُرفَض
  # المقال. عتبة الطول (كلمتان فأكثر متتاليتان كلتاهما غير معروفتين) تفادي
  # إنذارات كاذبة من إعادة الصياغة المشروعة (القاعدة 5 تُلزم بها) — كلمة
  # واحدة جديدة متوقَّعة دومًا، كلمتان معًا إشارة أقوى بكثير. انظر
  # article._unsourced_entities — يُصقَل هذا الرقم بعد مراجعة حالات حقيقية
  unsourced_entity_min_run: 2
  # بوابة الكفاية العددية (تعليق الموافقة، البند 3 وتصحيحه اللاحق، ثم بند 6
  # في تعليق الموافقة الثاني): عدد الوقائع المسندة الكافي لمقال قائم بذاته.
  # تُفحص على مجموعة الوقائع التي اجتازت السند فعلًا فقط — لا على كل ما
  # استُخرج من الموجز — والسؤال يُشتق بعدها من هذه المجموعة المُرشَّحة
  # حصرًا، لا العكس (انظر _write_article وCLAUDE.md): بلا هذا الترتيب يُمكن
  # اشتقاق السؤال من واقعة لم تجتز السند بعد، فتصير "محورية" بحكم كونها
  # اختيرت لا لأنها فُحصت. منذ أن صارت أسئلة الموجز تُبحث فعليًا، إجاباتها
  # المسندة (غالبًا مرجعية/خلفية) تدخل هذا العدّ أيضًا — فـ_sufficiency
  # تشترط زيادةً على العدد وجود واقعة واحدة غير مرجعية على الأقل ضمنه، وإلا
  # يُمكن اجتياز العتبة بخلفية موثَّقة سلفًا بلا خبر جديد فعليًا.
  min_grounded_facts: 2
  max_statements: 8            # سقف عدد الوقائع المفحوصة من الموجز
  max_questions: 5
  query_max_words: 5
  naming_max_context_terms: 3  # سلّم تسمية الحدث المبهم (مرحلة احتياطية عند
  # فشل البحث المباشر بالكيانات+التاريخ فقط، تعليق الموافقة الثاني، البند
  # 1): أقصى عدد كلمات سياق يستخلصها نداء نموذج من نصوص البحث المرجعي (لا
  # ترجيح تكرار خام — البند 3) تُجرَّب مع كل تاريخ عند بناء استعلام سياق+تاريخ
  naming_max_topic_words: 2    # الدرجة الثالثة في السلّم (تشخيص Issue #373،
  # البند 2): حين تفشل مباشر وسياق كلتاهما، تُجرَّب كلمات من topic (موضوع
  # الموجز العام) + كل تاريخ كملاذ أخير قبل الاستسلام — انظر article._topic_words
  naming_date_window_days: 2   # بوابة اتساق التسمية (تعليق التنفيذ على Issue
  # #364، البند 2): ذكر كيانات الواقعة الأصلية في وثائق التسمية وحده لا
  # يكفي — يجب أن يتفق تاريخها (سنة+شهر إلزامًا، ويوم إن وُجد في الجانبين)
  # مع تاريخ الواقعة المبهمة أيضًا، وإلا تُرفض التسمية ويواصل السلّم. الفارق
  # المسموح به باليوم وحده (لا الشهر ولا السنة) لأن تقارير الوكالات قد
  # تسجّل يوم النشر لا يوم الحدث نفسه بفارق يوم أو يومين
  max_shared_run_words: 7      # فحص النسخ اللفظي (verify_draft.check_originality) مُعاد استعماله كما هو
  repeat_within_source_min_count: 2  # نفس الإعفاء الأول (verify_draft أعلاه)، مستقل هنا
  trim_min_core: 4              # نفس تقليم verify_draft أعلاه، مستقل هنا (تشخيص Issue #373؛ خُفِّض إلى 4 ثم أُرجِع إلى 5 ثم خُفِّض من جديد إلى 4 للحالة الخامسة — «هوي كا يان معروف بالصينية باسم شو»/_name_link_exempt — راجع تعليق verify_draft.trim_min_core أعلاه للتفصيل)
  # استبعاد إعادات نشر الموجز الملصق قبل حساب استقلالية المصادر (طلب
  # المراجعة، تشخيص Issue #373، تعليق العطل الحادي والعشرون، البند 1): وثيقة
  # قُرئت خلال البحث (article._cached_search حصرًا — مسار الوقائع/التصريحات/
  # التقارير المنقولة، لا مراحل تسمية/سند/سؤال) قد تكون إعادة نشر حرفية لنفس
  # نص الموجز الملصق (المصدر الأصلي الذي يقتبس منه المستخدم مقاله) — لا شهادة
  # مستقلة ثانية، بل نفس النص. الكشف بتتابع كلمات متجاور فعلي (لا تشابه كيسي/
  # Jaccard الذي يرتفع زورًا لمجرد اشتراك المفردات بين تغطيتين مستقلتين
  # لنفس الحدث): article._longest_shared_run تبحث عن أطول تتابع مشترك بين
  # كلمات الموجز وكلمات الوثيقة؛ وثيقة تبلغ هذا الحد تُستبعَد كليًا من
  # مرشّحي هذا الاستعلام (لا تدخل عدّ _support_sources ولا فحص الأصالة
  # extra_docs) — بلا استبعاد صامت، كل استبعاد يُسجَّل في trail بعدد الكلمات
  # المشتركة الفعلي. 40 قيمة ابتدائية (لا مشتقة من شاهدين كـRELEVANCE_CAP —
  # تحتاج مراجعة الحالات العشر الأولى لضبطها على أدلة، كما طلبت المراجعة)
  brief_reprint_min_shared_words: 40
  opinion_attribution_phrase: "وترى الصفحة أن"  # صيغة نسبة رأي صاحب الموجز
  # في المتن — تحريرية معلنة تُنشر فعليًا، لا "بحسب صاحب الطلب" الداخلية
  # مستقل عمدًا عن writer.post_length (مراجعة بشرية بعد أول نشر منشور بهذا
  # المسار): «مقال من المصادر» منتج مختلف عن منشور الجمع القصير — قد تُقرأ
  # تسعة مصادر مستقلة لواقعة واحدة، فمتن 60-90 كلمة (قيمة writer) يضغطها
  # ظلمًا. منشور فيسبوك مطوَّل يتحمّل هذا المدى بلا أن يبدو مقالًا صحفيًا
  # كاملًا يُقرأ خارج المنصة.
  post_length: "180 إلى 280 كلمة"
  # اختياري (مراجعة بشرية بعد أول نشر): true يبقي السلوك الحالي — رأي صاحب
  # الموجز يدخل المتن منسوبًا (القاعدة 2 في DRAFT_SYSTEM_TEMPLATE). false
  # يُسقطه من المتن كليًا؛ التقرير يذكره صراحة كإسقاط بقرار تهيئة، لا كوقيعة
  # سقطت لانعدام سند — تمييز مهم عن قسم "ما سقط من موجزي".
  include_opinion: false
  # استخراج وقائع من المصادر المقروءة نفسها، لا الموجز فقط (طلب المراجعة):
  # الموجز يحصر ما يمكن أن يقوله المقال على ما كتبه صاحبه، حتى حين تحمل
  # الوثائق المقروءة فعلًا وقائع أخرى ذات صلة مباشرة بنفس الحدث لم يذكرها.
  # بعد اكتمال بحث/قراءة وقائع الموجز وأسئلته، نداء واحد
  # (article.SOURCE_EXTRACT_SYSTEM) على أفضل الوثائق المقروءة (بالوزن ثم
  # الصلة، حتى source_extract_max_docs — article._rank_docs_for_source_extract)
  # يستخرج وقائع إضافية غائبة عن الموجز. كل واقعة مستخرَجة تُقارَن أولًا
  # بوقائع الموجز المسندة أصلًا (نداء دمج مستقل،
  # article._source_fact_duplicate_index) — نفس الحدث بصياغة مختلفة يُدمَج
  # لا يُعدّ مرتين، وإلا تخضع لنفس دورة البحث/القراءة/السند الكاملة كأي
  # "واقعة" عادية قبل أن تدخل المقال، بوسم origin: "source" للتمييز في
  # التقرير عن وقائع الموجز الأصلية (origin: "brief").
  #
  # يشحن مُعطَّلًا (false) عمدًا — نفس قرار include_opinion أعلاه: مرحلة
  # جديدة تضيف نداءَي نموذج إضافيَّين (استخراج + دمج) لكل واقعة مستخرَجة
  # لم تُختبَر بعد على تشغيلة حية فعلية. فعِّلها (true) بعد أول تشغيلة
  # ناجحة تُراجَع يدويًا — لا افتراضيًا على كل مقال قبل ذلك.
  source_extract_enabled: true
  source_extract_max_docs: 8
  source_extract_max_tokens: 2000
  # خط أساس ثابت (تشخيص Issue #373، الجولتان الرابعة والخامسة، البند 3):
  # موجز مرجعي واحد يُعاد تشغيله عبر --issue --baseline بعد كل تغيير في
  # article.py/evidence.py/extract.py يمسّ سلّم البحث أو بوابة الاتساق أو
  # عدّ السند — فتُقاس النتيجة الفعلية (عدد الوقائع المسندة، مصادر كل
  # استعلام) في state/article_baseline.md بدل مناقشة تفسيرات بلا دليل.
  #
  # رقم Issue فقط — لا نسخة من نص الموجز نفسه هنا (الجولة الخامسة، البند 3:
  # نسخ الموجز إلى config.yaml يخلق نسختين قد تتفرّقان؛ main() يقرأ نص هذا
  # الـ Issue حيًّا عبر review.fetch_issue_body في كل تشغيلة --baseline).
  # حدِّثه كلما فتحتَ جولة اختبار جديدة على نفس الموجز (Issue جديد بنفس
  # النص المُلصَق يدويًا) — تعديل رقم واحد لا نسخ فقرة.
  baseline_issue_number: 380

# ── رادار العاجل ───────────────────────────────────────────
# يعمل كل ربع ساعة على المصادر الأقوى. الفحص مجاني تمامًا (لا استدعاء
# للنموذج)، والتكلفة تقع فقط عند العثور على خبر يستحق.
radar:
  enabled: true
  max_sources: 25            # أقوى المصادر وزنًا (أو وسم radar: true)
  max_age_hours: 6           # نافذة ضيقة — العاجل حديث بطبعه
  max_per_run: 1             # خبر واحد لكل فحص مهما تعدد

  # عتبات الالتقاط (حساسة: عدة أخبار يوميًا)
  min_velocity: 0.70         # 2.1 مصدر جديد في الساعة
  min_score: 16.0
  min_sources: 2
  screen_top: 10             # كم التقاطًا يمر بفرز الجدارة

  # ⚠️ النشر التلقائي بلا مراجعة — الشروط مجتمعة لا واحد منها
  auto_publish: true
  # 26.0 لم تُبلَغ قط: أعلى مؤشر تحقق فعليًا خلال 12 يومًا كان 23.5
  # (361 مسودة مفحوصة، 121 من الرادار). 19.3 هو المئين 75 على التوزيع
  # الفعلي — يعطي نحو ربع الالتقاطات (Issue #303).
  auto_publish_min_score: 19.3
  # 4 كانت تستبعد 86% من الالتقاطات بلا مسوّغ: عدد المصادر لا يميّز
  # المرفوض عن المنشور فعليًا (بل مرفوضات الرادار كانت أعلى قليلًا في
  # المتوسط) — يبقى بحدّ التقاط الرادار نفسه بدل مرشّح جودة ثانٍ لا يعمل.
  auto_publish_min_sources: 2
  auto_publish_daily_limit: 3     # سقف يومي صارم
  # نافذة العناوين المنشورة التي تُقارَن بها دلاليًا (merge.find_duplicate_event)
  # لرفض تحديث/تطور لخبر منشور كخبر مستقل بلا مراجعة (Issue #303)
  auto_publish_dedupe_days: 3

  # من لا يستوفي شروط النشر التلقائي أعلاه: يُحفظ مرشحًا خامًا (بلا صياغة
  # ولا صورة) في state/candidates ليظهر مع مرشحي preselect.enabled في أقرب
  # Issue اختيار يفتحه collect.py، بدل صياغته وبناء صورته ثم رفضه غالبًا في
  # المراجعة. مستقل عمدًا عن preselect.enabled — الرادار قد يُبقيه مفعّلًا
  # حتى لو كانت دورة collect العادية لا تزال تصوغ كل مسودة مباشرة (Issue #312).
  # false يعيد سلوك ما قبل #312: صياغة كل التقاطة وفتح Issue مراجعة فورية.
  preselect_fallback: true

# ── الدمج الدلالي عبر اللغات ───────────────────────────────
# مقارنة الكلمات تفشل عبر اللغات: «OPEC cuts output» و«L'OPEP réduit sa
# production» لا يشتركان في حرف. استدعاء واحد رخيص بـ Haiku يجمّعهما
# حسب الحدث، فيرتفع مؤشر التغطية وتُقاس السرعة بحق.
merge:
  enabled: true
  model: "claude-haiku-4-5-20251001"
  top: 60                    # عدد المتصدّرين الذين يمرّون بالدمج

# ── الفرز الأولي (توفير التكلفة) ────────────────────────────
# استدعاء رخيص واحد بنموذج Haiku يفحص عشرات العناوين دفعة واحدة ويستبعد
# غير الصالح قبل أي قراءة أو تحليل. بدونه كان البوت يقرأ ثلاثة مقالات
# كاملة ثم يكتشف أن الخبر لا يستحق — فيدفع الثمن مقابل لا شيء.
screening:
  enabled: true
  model: "claude-haiku-4-5-20251001"
  # التعلّم من رفضك: أسبابك تُمرَّر للفرز فيستبعد ما يشبهها قبل الصياغة.
  # ⚠️ يُطبَّق السبب حرفيًا ولا يُعمَّم على مصدر أو بلد.
  use_feedback: true
  feedback_examples: 12      # كم مثالًا من رفضك الأخير يُمرَّر

# ── قراءة نص الخبر ─────────────────────────────────────────
# البوت يقرأ نص الخبر كاملًا لكل التصنيفات — لا للتحليل بل لاستخراج
# الوقائع: الأسماء والأرقام وأوصاف ما جرى. بدونها يكتب النموذج من
# العنوان والملخص فيخرج المنشور إنشاءً بلا تفاصيل.
reading:
  enabled: true
  max_sources: 1             # مصدر واحد يكفي للوقائع

# ── التحليل متعدد المصادر ──────────────────────────────────
# البوت يقرأ نص الخبر كاملًا من عدة ناشرين، فيرى ما يتفقون عليه وما
# يختلفون فيه — وهذا تحليل لا يملكه أي مصدر منفرد.
# ⚠️ يرفع التكلفة نحو 6-8 دولارات شهريًا. اجعل enabled: false لإيقافه.
analysis:
  enabled: true
  buckets: ["serious"]   # الجاد فقط؛ أضف "sport" أو "light" إن أردت
  min_sources: 2         # أقل من ذلك = لا تحليل (مصدر واحد ليس مقارنة)
  max_sources: 2         # سقف القراءة لكل خبر — كل مصدر يرفع التكلفة
  min_score: 12.0        # لا تحلّل إلا ما تجاوز هذا المؤشر (0 = حلّل الكل)

# ── الصورة ─────────────────────────────────────────────────
image:
  width: 1080                # مربع 1:1 — الأنسب لخلاصة فيسبوك
  height: 1080
  headline_max_chars: 90     # طول العنوان المكتوب على الصورة
  font_headline: "assets/fonts/Cairo.ttf"
  font_headline_weight: "Black"     # الخطوط المتغيرة: Bold / ExtraBold / Black
  font_body: "assets/fonts/Cairo.ttf"
  font_body_weight: "Bold"          # الخطوط المتغيرة: Regular / Medium / SemiBold / Bold
  sharpen: true              # تحسين حدة صورة الخبر
  composite: true            # صورة ثانية في دائرة إن توفّرت
  # الرياضة مستثناة: أخبار الانتقالات تذكر أندية كثيرة، فتُجلب صور
  # أشخاص لا علاقة لهم بالخبر (مدرب نادٍ ذُكر عرضًا مثلًا).
  composite_skip_buckets: ["sport"]
  inset_smart_side: true     # الدائرة تذهب للجهة الأقل ازدحامًا
  prefer_faces: true         # الصورة ذات الوجه الأبرز تتصدّر الخلفية
  face_min_ratio: 0.02       # أقل نسبة مساحة وجه تُعتد بها
  inset_ratio: 0.20          # نصف قطر الدائرة كنسبة من عرض الصورة
  auto_orient: true          # الواسع خلفية والقريب في الدائرة
  face_orient_gap: 0.01      # أقل حضور وجه يُعتد به للترتيب          # الواسع خلفية والقريب في الدائرة (تبديل تلقائي)
  inset_min_difference: 0.28 # أقل فارق في الشكل بين الصورتين
  inset_min_palette: 0.30    # أقل فارق لوني: أقل منه = صورة واحدة
  inset_closer_ratio: 1.5    # كم يجب أن يكون الأقرب أكبر ليُختار (1.5 = 50%)0    # أقل فارق في لوحة الألوان — يمنع صورتين
                             # لنفس المشهد من زاويتين # أقل فارق بصري مطلوب بين الصورتين (0-1).
                             # ارفعه إن ظهرت صور متشابهة، واخفضه إن اختفت
                             # الدائرة عن أخبار تستحقها.

# ── الريلز (فيديو رأسي) ────────────────────────────────────
# يُبنى بـ ffmpeg من صورة الخبر وعنوانه — بلا تكلفة ولا خدمة خارجية.
# يُنتَج بجانب الصورة، وتختار في صفحة المراجعة أيهما تنشر.
reel:
  enabled: true
  duration_seconds: 10
  fps: 30
  zoom: 1.12               # قوة التقريب البطيء
  first_layer_at: 0.4      # متى تظهر أول طبقة (ثانية)
  layer_step: 0.45         # الفاصل بين ظهور سطر وآخر
  crf: 24                  # جودة الضغط: أقل = أوضح وأثقل
  timeout: 180
  keep_days: 3             # حذف الريلز الأقدم لتخفيف حجم المستودع

# ── البحث عن صورة بديلة ────────────────────────────────────
# حين لا يوفّر الناشر صورة، يبحث البوت في مكتبات حرة الترخيص.
# ⚠️ لا نبحث في جوجل صور: نتائجه محمية بحقوق النشر، وفيسبوك يرصدها آليًا
# وقد يقيّد الصفحة. المكتبتان أدناه مجانيتان بالكامل للاستخدام التجاري.
# كل صورة من هنا تُوسم على الكارت بعبارة "صورة تعبيرية".
image_search:
  enabled: true
  providers: ["wikimedia", "openverse"]
  max_terms: 3               # كم عبارة بحث تُجرَّب من العنوان

# ── فيسبوك ─────────────────────────────────────────────────
facebook:
  api_version: "v21.0"
  publish_as_photo: true

  # الرابط في التعليق الأول بدل المتن: فيسبوك يخفض وصول المنشورات
  # التي تُخرج المستخدم من المنصة عبر رابط خارجي.
  link_in_first_comment: true
  comment_prefix: "المصدر"

  # الجدولة
  schedule_enabled: true
  timezone: "Europe/Istanbul"     # توقيت جمهورك

  # burst = ملصق «عاجل» يُنشر فورًا، والبقية كل burst_gap_minutes
  # peak  = توزيع على ساعات الذروة (يؤجّل حتى العاجل — لا يُنصح به)
  schedule_mode: "burst"
  # فاصل عشوائي بين المنشورات العادية. العشوائية مقصودة: الإيقاع الثابت
  # تمامًا نمط آلي واضح، وفيسبوك يخفض وصول الصفحات التي تبدو مؤتمتة.
  gap_min_minutes: 30
  gap_max_minutes: 60
  # أقصى انتظار داخل تشغيل واحد. ما يتجاوزه يبقى في الطابور ليلتقطه
  # سيّر «نشر الطابور» — فلا تبقى وظيفة معلّقة ساعات بلا داعٍ.
  max_inline_minutes: 120
  # سقف الانتظار الداخلي حين يستدعي collect_finalize.finalize دفعة النشر
  # من داخل مهمة urgent في publish.yml (سقفها 20 دقيقة) — لا max_inline_minutes
  # أعلاه، لأن أصغر فاصل يحسبه spaced_slots (gap_min_minutes) هو 30 دقيقة
  # أصلًا، أكبر من سقف المهمة نفسه. صفر يعني: يُنشر المستحق الآن فقط،
  # والبقية queued بلا نوم يلتقطها سيّر «نشر الطابور» (Issue #315).
  finalize_inline_minutes: 0

  # تُستخدم في نمط peak فقط
  peak_hours: [12, 18, 21]        # ساعات النشر المفضّلة (0-23)
  min_gap_minutes: 120            # أقل فاصل بين منشورين

# ── سجل القرارات (Issue #583 — المرحلة الأولى: جمع بلا تحليل) ─
# المراجع لا يستعمل شارة الرفض (`/reject`) إطلاقًا، فتجاهله الفعلي بلا
# اعتماد ولا رفض صريح لا يترك أثرًا. src/decisions.py يستنتج إشارتين من
# سلوك موجود أصلًا: dismissed_closed (أُغلق الـ Issue بلا اعتماد لهذه
# المسودة تحديدًا — صريح) وignored_timeout (بقي مفتوحًا أكثر من الحد أدناه
# بلا بتّ — تخمين). عرضٌ وجمعٌ فقط؛ لا تأثير على أي فرز أو ترتيب.
decisions:
  # افتراض أولي (لا نهائي): تشغيلات collect.yml تتكرر عدة مرات يوميًا، وقد
  # يفوت المراجع يومًا كاملاً — 48 ساعة تكفي دورتي مراجعة كاملتين قبل عدّ
  # المسودة "متجاهَلة" بدل "لم يصل الدور إليها بعد". يُراجَع على أدلة فعلية
  # بعد تراكم أول 30 قرارًا (طلب المراجع صراحة، Issue #583).
  ignore_timeout_hours: 48

# ── يوتيوب: تثبيت نتائج قياس القنوات (Issue #619 → #626) ────
# لا مسار تحليل يوتيوب بعد — هذا تثبيت بيانات قياس مَحلي فقط، لا بناء.
# القياس المحلي (Issue #619، من عنوان منزلي بلا بروكسي) أعطى ٩٣٪ توفّر نص:
# ٦٠٤ من ٦٥٠ فيديو، بلا حظر واحد. لكن يوتيوب يحجب عناوين مزوّدي السحابة
# تحديدًا، ونطاقات GitHub Actions منها — هل الحجب قائم من هناك سؤال منفصل
# يحسمه tools/test_actions_block.py وحده؛ لا شيء هنا يفترض الجواب.
# راجع docs/channel_survey_2026-08.md للملخّص الكامل.
youtube:
  max_per_channel: 3
  min_duration_minutes: 8
  max_duration_minutes: 150
  exclude_live: true
  lookback_hours: 30
  min_blocs_per_topic: 2
  # كم يومًا يبقى معرّف الفيديو في state/youtube_seen.json قبل تقليمه —
  # أعلى من lookback_hours بفارق واسع فيبقى منع التكرار فعّالًا حتى لو
  # تأخّرت تشغيلة يدوية أيامًا، بلا نمو غير محدود لملف السجل.
  seen_retention_days: 14

  # ── المرحلة الثانية: الاستخلاص (src/youtube_extract.py، Issue #631) ──
  extract:
    model: "claude-haiku-4-5-20251001"  # أرخص طبقة متاحة -- استخلاص نقاط لا تحليل عميق
    # Issue #637 العطل ٢: 2000 كانت تقطع إخراج المواد التحليلية الثقيلة قبل
    # اكتمال بلوك tool_use (سبع نقاط بحقولها الستة تحتاج أكثر بكثير) فتعود
    # النتيجة نصًّا فارغًا بعد كل المحاولات. رُفعت بسخاء لا بالحدّ الأدنى
    # الملحوظ، فالتكلفة (نموذج Haiku رخيص) أهون من فقدان أثمن الفيديوهات.
    max_tokens: 8000
    # حدّ أعلى لطول النص المُرسَل للنموذج (Issue #637 العطل ٢) -- نصوص أطول
    # من هذا تُقصّ ذكيًا (النصف الأول + النصف الأخير، انظر
    # youtube_extract._truncate_transcript)؛ الخاتمة في المواد التحليلية
    # غالبًا تحمل الخلاصة فلا يصحّ قصّها من الآخر فقط. القيمة تقريبًا نص
    # ساعتين كلام متصل بمعدل ٩ أحرف/ثانية.
    max_transcript_chars: 60000
    # فاصل عشوائي بين نداءات سحب النص المتتالية -- نفس نمط
    # tools/test_actions_block.py، لتفادي شكل استخدام آلي واضح لسحب النص.
    # Issue #637 العطل ٣: [2.0, 5.0] لم يكفِ فحُجب عنوان Webshare نفسه بعد
    # طلبات متتابعة (429 وRemoteDisconnected) رغم وجود بروكسي -- وُسِّع.
    transcript_sleep_range: [5.0, 12.0]
    # فاصل أطول عند الانتقال من قناة لأخرى (Issue #637 العطل ٣) -- يوزّع
    # الحمل على عنوان البروكسي بدل تتابع منتظم عبر كل القنوات بلا تمييز.
    channel_sleep_range: [10.0, 20.0]
    # تراجع أُسّي عند حجب مؤقت (429/IpBlocked) أو انقطاع اتصال
    # (RemoteDisconnected) أثناء سحب النص (Issue #637 العطل ٣): طول القائمة
    # = عدد إعادات المحاولة قبل تسجيل الفيديو "محجوب" ورفعه في
    # videos_rate_limited بدل استهلاك تشغيلة كاملة على عنوان محجوب مؤقتًا.
    rate_limit_backoff_seconds: [15, 45, 90]
    # عدد محاولات نداء الاستخلاص المهيكل قبل تسجيل فشل (Issue #635، العطل ٢):
    # محاولة أولى + إعادة محاولة واحدة عند غياب إخراج مهيكل صالح.
    max_retries: 2
    # حارس الموضوع (Issue #635، العطل ٥): نموذج رخيص بمقتطف قصير جدًا يميّز
    # التحليل السياسي عن النشرات والرياضة قبل إنفاق نداء الاستخلاص الكامل.
    topic_guard_model: "claude-haiku-4-5-20251001"
    topic_guard_excerpt_chars: 2000
    # قائمة مرجعية صغيرة لأعلام سياسية شائعة (Issue #639 العطل ١ بند ب) --
    # تحقّق بأفضل ما يمكن لا استخراج أعلام عام: إن ظهر اسم من هذه القائمة في
    # statement بلا أي من aliases (الاسم الأصلي أو صيغه الشائعة) في
    # quote_original، تُسجَّل نقطة تحذير في failed (عدّاد
    # points_flagged_unsourced_name) لا رفض تلقائي -- الترجمة الصوتية تجعل
    # مطابقة عامة غير موثوقة، والمالك يحتاج التحذير عند المراجعة أكثر من
    # رفض آلي قد يخسر نقاطًا صحيحة (شاهد الـIssue: SÖZCÜ، النموذج أضاف
    # "إدارة جو بايدن" رغم أن الاقتباس التركي المرفق لم يذكر بايدن إطلاقًا).
    known_figures:
      - ar: "بايدن"
        aliases: ["biden"]
      - ar: "ترامب"
        aliases: ["trump"]
      - ar: "بوتين"
        aliases: ["putin"]
      - ar: "أردوغان"
        aliases: ["erdogan", "erdoğan", "tayyip"]
      - ar: "إردوغان"
        aliases: ["erdogan", "erdoğan", "tayyip"]
      - ar: "نتنياهو"
        aliases: ["netanyahu"]
      - ar: "زيلينسكي"
        aliases: ["zelensky", "zelenskyy", "zelenskiy"]
      - ar: "ماكرون"
        aliases: ["macron"]
      - ar: "شي جين بينغ"
        aliases: ["xi jinping"]
      - ar: "كامالا هاريس"
        aliases: ["kamala harris", "harris"]
      - ar: "بلينكن"
        aliases: ["blinken"]
      - ar: "بومبيو"
        aliases: ["pompeo"]

  # ── المرحلة الثالثة: العنقدة (src/youtube_cluster.py، Issue #646) ──
  cluster:
    model: "claude-sonnet-5"  # قوة متوسطة -- تجميع دلالي (الصدى مقابل
    # التقاطع الحقيقي) يحتاج فهمًا أعمق من فرز Haiku الرخيص، لكن نداء واحد
    # فقط في كل تشغيلة فلا يبرر تكلفة article.model الأعلى.
    # Issue #660: تشغيلة فعلية بـ١٧٣ نقطة مدخلة (بعد توسيع lookback_days في
    # #658) أعادت بلوك tool_use فارغًا بعد 4000 -- نفس نمط عطل الاستخلاص
    # (Issue #637): النموذج يُقطع قبل إكمال البلوك. رُفعت بسخاء: ٤٠ قضية ×
    # (عنوان + event + قائمة معرّفات + مؤشّر خلاف) قد تتجاوز ٨٠٠٠ رمز بسهولة.
    max_tokens: 16000
    # عدد محاولات نداء العنقدة قبل تسجيل فشل (Issue #660) -- نفس مبدأ
    # youtube.extract.max_retries: محاولة أولى + إعادة محاولة واحدة عند غياب
    # إخراج مهيكل صالح (قطع بسبب max_tokens أو استجابة فاسدة أخرى).
    max_retries: 2
    # أقصى عدد نقاط تُرسَل لنداء عنقدة واحد (Issue #660، الإصلاح ٢) -- نافذة
    # lookback_days الثلاثة تتراكم مع تكرار التشغيل (٧٠ ← ١٧٣ رُصدت فعليًا،
    # وستتجاوز ٢٥٠ خلال أسبوع)، ورفع max_tokens وحده لن يكفي إلى الأبد. عند
    # التجاوز تُؤخذ الأحدث حسب run_date ثم ترتيب الظهور (youtube_cluster.
    # apply_points_cap) وتُسقَط الأقدم -- مقايضة تقلّص النافذة الفعلية عند
    # ازدحام الأيام، مقبولة لأنها أبسط من تقسيم النداء على دفعتين ودمج
    # القضايا (لا تُنفَّذ الآن، انظر الـIssue).
    max_points_per_call: 150
    # سقف عدد القضايا المسموح لكتلة لغوية واحدة أن تحتلّه في القائمة
    # المُخرَجة -- بلا هذا قد تُغرِق كتلة نشيطة (نقاط كثيرة تلك التشغيلة)
    # القائمة كاملة على حساب كتل أخرى فعلية لكن أقل حجمًا (نص الـIssue).
    max_per_bloc: 4
    # عدد الأيام (شاملًا اليوم الحالي) التي تُقرَأ نقاطها معًا قبل العنقدة
    # (Issue #658 العطل ١) -- نافذة يوم واحد كانت تمنع التقاطع عبر الكتل
    # بنيويًا: قناتان تتناولان نفس الحدث نادرًا ما تنشران في نفس اليوم
    # بالضبط (شاهد التشغيلة الأولى: صفر قضايا طبقة أ، صفر خلاف). ٣ أيام
    # توازن بين إتاحة فرصة حقيقية للتقاطع وبين تقادم النقاط (بلا سجل
    # الاستهلاك أدناه، ستُعاد نفس القضية أيامًا متتالية).
    lookback_days: 3
    # أدنى عدد نقاط تدخل القضية مخرج العنقدة (Issue #658 العطل ٢) -- قضية
    # بنقطتين تخرج مقالًا هزيلًا يعترف بفقره بدل الامتناع عن الكتابة (شاهد
    # التشغيلة الأولى). استثناء طبقة (أ) بثلاث نقاط مُطبَّق في الشيفرة
    # (youtube_cluster.apply_min_points) لا هنا -- قيمتها في التقاطع عبر
    # كتلتين لا في كمّ نقاطها.
    min_points_per_topic: 4
    # حدّ تاريخي أدنى لملفات النقاط التي تدخل النافذة (Issue #662 العطل ٢) --
    # ملف ٢٩ أغسطس٢٠٢٦ أنتج نقاطًا بطوابع مختلَقة (قبل إصلاح المرساة) ومرّت
    # فيديوهات نشرات كان يفترض بحارس الموضوع إهمالها (قبل تشديده) -- نافذة
    # lookback_days الثلاثية كانت تسحبها كما هي رغم عدم صلاحيتها، فتخلط
    # عصرين مختلفين من جودة الاستخلاص في تشغيلة واحدة. ارفع هذا التاريخ بعد
    # أي إصلاح جوهري مستقبلي في الاستخلاص، حتى لا تدخل العنقدة مادةٌ أُنتجت
    # بمنطق قديم.
    min_points_date: "2026-08-31"
    # نداء دمج القضايا المتناولة لنفس الحدث بعينه (Issue #662 العطل ١) --
    # مقارنة جمل `event` القصيرة فقط، لا نصّ القضية كاملًا، فيكفي نموذج رخيص
    # جدًا (نفس مستوى حرّاس الموضوع أدناه) بدل model الأقوى المخصَّص للعنقدة
    # نفسها.
    merge_model: "claude-haiku-4-5-20251001"
    merge_max_tokens: 2000
    merge_max_retries: 2
    # حارس عقلانية (Issue #662 متابعة): تشغيلة فعلية أعطت قضية واحدة من ٢٠٩
    # نقطة مدخلة -- إخراج مهيكل (tool_use) صالح الشكل تمامًا، بلا رسالة خطأ
    # ولا stop_reason غير طبيعي، لكن هزيل دلاليًا لدرجة تُبطل قيمة العنقدة.
    # مدخل يتجاوز sanity_min_points ينتج عدد قضايا صالحة دون sanity_min_issues
    # يُعَدّ فشل محاولة صريحًا في cluster_points (يُعاد المحاولة، لا يُقبَل
    # كنجاح هزيل) -- القيمتان تحوّطيتان (أدنى تقاطع متوقَّع من مدخل بهذا
    # الحجم)، لا عتبة مضبوطة إحصائيًا.
    sanity_min_points: 50
    sanity_min_issues: 5

  # ── المرحلة الرابعة: الكتابة (src/youtube_article.py، Issue #646) ──
  article:
    model: "claude-opus-5"  # أقوى نموذج متاح في هذا المشروع (انظر جدول
    # التكلفة في src/writer.py) -- الكتابة هنا نثر تحريري كامل (عنوان +
    # فقرات + رؤوس فرعية + نسبة دقيقة لكل متحدث)، لا استخلاص نقاط مختصرة
    # ولا تجميع دلالي، فتستحق أقوى طبقة بخلاف extract.model/cluster.model.
    # Issue #662 (تعليق المتابعة): تشغيلة فعلية بالبنية الجديدة (سطر تقدير +
    # خمسة أقسام ثابتة + مصادر) أظهرت أقسامًا تظهر بالترتيب الصحيح ثم تنقطع،
    # ومحاولات تعيد صفر أقسام رغم إنتاج نصّ -- نفس نمط القطع المشخَّص سابقًا
    # في youtube.cluster.max_tokens وyoutube.extract. رُفعت بسخاء من ٣٠٠٠.
    max_tokens: 8000
    # البنية الجديدة (Issue #671 -- سطر تقدير + خمسة أقسام ثابتة الأسماء +
    # مصادر) أعقد من القديمة، والمحاولة الثالثة رخيصة مقارنةً بخسارة مقال
    # من طبقة (أ) -- رُفعت من ٢ إلى ٣.
    max_retries: 3
    count: 10  # أعلى عدد قضايا تُكتَب عنها مقالات من مخرج cluster المرتَّب
    # حارس المحظورات (طبقة ج فقط -- انظر FORBIDDEN_CATEGORIES في
    # src/youtube_article.py) نموذج رخيص منفصل قبل إنفاق نداء الكتابة
    # الأقوى، بنفس مبدأ topic_guard_model في youtube.extract أعلاه.
    guard_model: "claude-haiku-4-5-20251001"
    # سلّم شيرمان كنت (١٩٦٤) للترجيح -- Issue #671 النقطة ٣. سطر
    # **التقدير:** يجب أن يحوي واحدة من هذه العبارات حصرًا، ويُفرَض بحارس
    # آلي بدل الاعتماد على فهم كل قارئ للفظ "مرجّح" -- ميزة لا يملكها تحليل
    # بشري، ولا يجوز إهدارها.
    likelihood_terms:
      - "شبه مؤكّد"
      - "مرجّح بقوة"
      - "مرجّح"
      - "الاحتمالان متساويان"
      - "مستبعد"
      - "مستبعد جدًا"
    # هامش حول الطول المذكور في prompts/youtube_article.md (٤٠٠–٦٠٠ كلمة) --
    # Issue #671 (تعليق المتابعة): حدّان بدل عتبة دنيا فقط، فمقال طويل جدًا
    # عرض عن الحرفة التحليلية مثلما مقال قصير جدًا لا يفي بها.
    # خُفِّض من ٣٠٠ إلى ٢٥٠ (Issue #662 تعليق المتابعة): المقال الناجح الوحيد
    # حتى الآن ٤٧٠ كلمة، لكن قضية بأربع نقاط مصدرية فقط (أدنى min_points_per_topic)
    # قد تنتج مقالًا أقصر مشروعًا لا يستحق رفضًا وإعادة محاولة.
    min_words: 250
    max_words: 750

  # ── المرحلة الخامسة: توصيل الصورة/المسودة/المراجعة/النشر (src/youtube_publish.py، Issue #676) ──
  image:
    # علامة بصرية ثابتة على بطاقة العنوان (نصّ الـIssue #676) تميّز هذا
    # المسار عمّا تنشره الصفحة بصفته تقريرًا عاديًا.
    badge_text: "تحليل"
    # عرض عربي لقيم bloc الإنجليزية المخزَّنة في channels أدناه (arabic/
    # turkish/persian/israeli) — الشريط السفلي يعرض "عربية · فارسية" لا
    # "arabic · persian".
    bloc_labels:
      arabic: "عربية"
      turkish: "تركية"
      persian: "فارسية"
      israeli: "إسرائيلية"

  publish:
    # سقف منشورات يوتيوب لكل تشغيلة نشر (نصّ الـIssue #676) — ضمن سقف
    # الصفحة اليومي لا فوقه. publish.cmd_burst القائمة بلا سقف عدد أصلًا
    # (فاصلها عشوائي فقط)، فهذا مفهوم جديد يخصّ هذا المسار وحده.
    max_per_run: 3
    # الفاصل الثابت بين كل منشور والتالي داخل التشغيلة نفسها — خلافًا
    # لفاصل facebook.gap_min_minutes/gap_max_minutes العشوائي المستعمَل في
    # المسار العام، هذا فاصل ثابت مقصود (نصّ الـIssue #676).
    spacing_minutes: 40

  # ── دورة المراجعة: درجة مركّبة + عناوين متعدّدة (src/youtube_publish.py
  # وsrc/youtube_article.py، Issue #680) — لا علاقة لهذا القسم بمراحل
  # الجمع/الاستخلاص/العنقدة (خارج نطاق الـIssue)، فهو يضبط عرض/ترتيب/اختيار
  # دورة المراجعة وحدها.
  review:
    scoring:
      # الدرجة = عدد القنوات + (عدد الكتل − ١) × bloc_bonus + مكافأة الخلاف
      # (compute_score في src/youtube_publish.py) -- تعالج ظلم الترتيب
      # بالطبقة (أ/ب/ج) وحدها: الطبقة تُحسَب من **وجود** كتلتين لا من **عدد**
      # المصادر الفعلي، فقضية من ثلاث قنوات في كتلة واحدة (طبقة ب) كانت
      # تُرتَّب دومًا بعد قضية من قناتين في كتلتين (طبقة أ) رغم كونها أقوى.
      bloc_bonus: 2
      agreement_bonus:
        cross_source: 3   # خلاف حقيقي بين قنوات مختلفة -- أعلى قيمة تحريرية
        internal: 1       # خلاف بين متحدثين داخل مصدر واحد
        agreement: 0      # اتفاق تام بين المصادر -- لا مكافأة ولا عقوبة
        echo: -2          # نفس الخبر معاد صياغته -- عقوبة، لا قيمة تحليلية

    headlines:
      # نداء منفصل رخيص بعد نجاح الكتابة (generate_headlines في
      # src/youtube_article.py) -- لا تعديل على prompts/youtube_article.md
      # ولا على بنية المقال (خارج نطاق الـIssue صراحةً)، فهذا برومبت ونداء
      # جديدان بالكامل، لا امتداد للكتابة الأقوى.
      model: "claude-haiku-4-5-20251001"
      max_tokens: 600
      max_retries: 2
      # سقف كلمات كل عنوان من الثلاثة (نصّ الـIssue #680) -- يُفرَض بتحقّق
      # آلي بعد الاستلام (_validate_headlines)، لا بالثقة بطاعة النموذج وحدها.
      max_words: 15

