# ── الموضوعات الرائجة (Google Trends) ───────────────────────
# إشارة *الطلب*: ما يبحث عنه الناس فعلًا، لا ما تنشره الوكالات.
# الخبر الذي تغطيه عدة وكالات ويطابق موضوعًا رائجًا يتصدر الترتيب.
trends:
  enabled: true
  # 8.0 لا 4.0: مؤشر "كم وكالة غطّته" يعاقب الأخبار الخفيفة أصلًا —
  # الغرائب تنشرها مواقع قليلة لكنها تنتشر بجنون. الترند يصحّح ذلك.
  weight: 8.0
  # ⚠️ هذه دول *جمهورك* لا دول مصادرك. المصادر تحدد من أين تأتي الأخبار،
  # والترند يحدد ما يهتم به قراؤك — وهم عرب.
  geos: ["EG", "SA", "AE", "MA", "DZ", "IQ", "JO", "KW", "TN", "LY", "YE", "QA", "OM"]

# ── الترشيح والترتيب ────────────────────────────────────────
selection:
  max_age_hours: 30          # نافذة أوسع للقصص بطيئة الاشتعال
  drafts_per_run: 5
  # حصص كل دفعة: ثلثان خفيف/رياضة، وثلث جاد.
  # عدّل الأرقام لتغيير هوية الصفحة. احذف القسم لإلغاء الحصص.
  # دفعة من خمسة: غرابتان + رياضة + نافع + جاد.
  # رفعنا الخفيف إلى اثنين، ولو أبقينا الدفعة عند أربعة لسقط الجاد
  # من الحصص كليًا. لتعود إلى أربعة: اجعل serious: 0 و drafts_per_run: 4
  # — عندها يظهر الجاد فقط حين تعجز التصنيفات الأخرى عن ملء فتحاتها.
  quotas:
    light: 2      # غرائب وطرائف وثقافة وطعام
    sport: 1      # رياضة
    useful: 1     # صحة، تقنية، اقتصاد شخصي، هجرة
    serious: 1    # سياسة واقتصاد كلي          # عدد المسودات المولّدة في كل تشغيل
  min_sources_for_trend: 1   # ارفعه إلى 2 لنشر ما تتفق عليه عدة مصادر فقط
  dedupe_memory_days: 5      # لا تعد نشر خبر مشابه خلال هذه المدة
  title_similarity: 0.62     # حد التشابه لدمج نفس الخبر من مصادر مختلفة (0-1)
  screen_per_draft: 8        # كم مرشحًا يُفرز لكل مسودة مطلوبة
  screen_horizon_max: 90     # سقف الفرز مهما ارتفع المطلوب
  # تناوب المناطق: «الخفيف» يضم غرائب وطعامًا وثقافة وآثارًا بفتحة واحدة.
  # بلا تناوب يبتلع أقواها كل الفتحات. الرقم = كم مسودة أخيرة تُستبعد
  # مناطقها. 6 يعني: لا تكرر منطقة ظهرت في آخر ست مسودات.
  region_cooldown: 6
  velocity_track_top: 250    # قياس السرعة للمتصدّرين فقط (يمنع تضخّم الحالة)
  velocity_weight: 5.0       # وزن *سرعة* الانتشار — أهم إشارة ترند حقيقية
  allow_followups: true      # اسمح بمنشور ثانٍ إن حمل تطورًا جديدًا فعليًا
  followup_min_hours: 10     # أقل فاصل بين منشورين عن الحدث نفسه
  region_diversity: true     # وزّع الأخبار جغرافيًا بدل تكديسها من منطقة واحدة
  max_per_region: 2          # سقف الأخبار من نفس المنطقة في الدفعة الواحدة
  blocklist_keywords:        # كلمات تستبعد الخبر تمامًا
    - "horoscope"
    - "betting odds"
    - "sponsored"

# ── الصياغة العربية (Claude API) ────────────────────────────
writer:
  model: "claude-sonnet-5"   # بديل أرخص: claude-haiku-4-5-20251001
  max_tokens: 3000           # سقف الرد — أقل منه يبتر المخرجات ويهدر المال
  tone: "خبري رصين، عربي فصيح مبسّط، بلا مبالغة أو إثارة"
  post_length: "60 إلى 90 كلمة"
  hashtags_count: 4
  include_source_credit: true

# ── الفرز الأولي (توفير التكلفة) ────────────────────────────
# استدعاء رخيص واحد بنموذج Haiku يفحص عشرات العناوين دفعة واحدة ويستبعد
# غير الصالح قبل أي قراءة أو تحليل. بدونه كان البوت يقرأ ثلاثة مقالات
# كاملة ثم يكتشف أن الخبر لا يستحق — فيدفع الثمن مقابل لا شيء.
screening:
  enabled: true
  model: "claude-haiku-4-5-20251001"

# ── قراءة نص الخبر ─────────────────────────────────────────
# البوت يقرأ نص الخبر كاملًا لكل التصنيفات — لا للتحليل بل لاستخراج
# الوقائع: الأسماء والأرقام وأوصاف ما جرى. بدونها يكتب النموذج من
# العنوان والملخص فيخرج المنشور إنشاءً بلا تفاصيل.
reading:
  enabled: true
  max_sources: 1             # مصدر واحد يكفي للوقائع

# ── التحليل متعدد المصادر ──────────────────────────────────
# البوت يقرأ نص الخبر كاملًا من عدة ناشرين، فيرى ما يتفقون عليه وما
# يختلفون فيه — وهذا تحليل لا يملكه أي مصدر منفرد.
# ⚠️ يرفع التكلفة نحو 6-8 دولارات شهريًا. اجعل enabled: false لإيقافه.
analysis:
  enabled: true
  buckets: ["serious"]   # الجاد فقط؛ أضف "sport" أو "light" إن أردت
  min_sources: 2         # أقل من ذلك = لا تحليل (مصدر واحد ليس مقارنة)
  max_sources: 2         # سقف القراءة لكل خبر — كل مصدر يرفع التكلفة
  min_score: 12.0        # لا تحلّل إلا ما تجاوز هذا المؤشر (0 = حلّل الكل)

# ── الصورة ─────────────────────────────────────────────────
image:
  width: 1080                # مربع 1:1 — الأنسب لخلاصة فيسبوك
  height: 1080
  headline_max_chars: 90     # طول العنوان المكتوب على الصورة
  font_headline: "assets/fonts/Cairo.ttf"
  font_headline_weight: "Black"     # الخطوط المتغيرة: Bold / ExtraBold / Black
  font_body: "assets/fonts/Cairo.ttf"
  font_body_weight: "Bold"          # الخطوط المتغيرة: Regular / Medium / SemiBold / Bold
  sharpen: true              # تحسين حدة صورة الخبر
  composite: true            # صورة ثانية في دائرة إن توفّرت (قالب الغرائب)
  inset_ratio: 0.20          # نصف قطر الدائرة كنسبة من عرض الصورة

# ── الريلز (فيديو رأسي) ────────────────────────────────────
# يُبنى بـ ffmpeg من صورة الخبر وعنوانه — بلا تكلفة ولا خدمة خارجية.
# يُنتَج بجانب الصورة، وتختار في صفحة المراجعة أيهما تنشر.
reel:
  enabled: true
  duration_seconds: 10
  fps: 30
  zoom: 1.12               # قوة التقريب البطيء
  first_layer_at: 0.4      # متى تظهر أول طبقة (ثانية)
  layer_step: 0.45         # الفاصل بين ظهور سطر وآخر
  crf: 24                  # جودة الضغط: أقل = أوضح وأثقل
  timeout: 180
  keep_days: 3             # حذف الريلز الأقدم لتخفيف حجم المستودع

# ── البحث عن صورة بديلة ────────────────────────────────────
# حين لا يوفّر الناشر صورة، يبحث البوت في مكتبات حرة الترخيص.
# ⚠️ لا نبحث في جوجل صور: نتائجه محمية بحقوق النشر، وفيسبوك يرصدها آليًا
# وقد يقيّد الصفحة. المكتبتان أدناه مجانيتان بالكامل للاستخدام التجاري.
# كل صورة من هنا تُوسم على الكارت بعبارة "صورة تعبيرية".
image_search:
  enabled: true
  providers: ["wikimedia", "openverse"]
  max_terms: 3               # كم عبارة بحث تُجرَّب من العنوان

# ── فيسبوك ─────────────────────────────────────────────────
facebook:
  api_version: "v21.0"
  publish_as_photo: true

  # الرابط في التعليق الأول بدل المتن: فيسبوك يخفض وصول المنشورات
  # التي تُخرج المستخدم من المنصة عبر رابط خارجي.
  link_in_first_comment: true
  comment_prefix: "المصدر"

  # الجدولة
  schedule_enabled: true
  timezone: "Europe/Istanbul"     # توقيت جمهورك

  # burst = ملصق «عاجل» يُنشر فورًا، والبقية كل burst_gap_minutes
  # peak  = توزيع على ساعات الذروة (يؤجّل حتى العاجل — لا يُنصح به)
  schedule_mode: "burst"
  burst_gap_minutes: 30
  # أقصى انتظار داخل تشغيل واحد. ما يتجاوزه يبقى في الطابور ليلتقطه
  # سيّر «نشر الطابور» — فلا تبقى وظيفة معلّقة ساعات بلا داعٍ.
  max_inline_minutes: 120

  # تُستخدم في نمط peak فقط
  peak_hours: [12, 18, 21]        # ساعات النشر المفضّلة (0-23)
  min_gap_minutes: 120            # أقل فاصل بين منشورين
