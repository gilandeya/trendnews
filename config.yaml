  logo: "assets/logo.png"                        # مسار شعارك، مثل: assets/logo.png
                                  #   PNG بخلفية شفافة هو الأفضل
                                  #   يحل محل الاسم النصي تمامًا
  tagline: "الخبر وما وراءه ... بعيون عالمية"  # سطر صغير تحت الاسم (فارغ = إخفاء)
  handle: "@world.window"          # يظهر في التذييل (فارغ = إخفاء)
  primary_color: "#12203A"         # لون الشريط السفلي
  accent_color: "#F0B429"          # لون خط التمييز وشعار العاجل

