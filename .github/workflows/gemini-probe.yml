name: 🧪 قياس Gemini

on:
  workflow_dispatch:
    inputs:
      model:
        description: "النموذج (فارغ = config.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: trendnews-gemini-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: سحب مستودع بيانات يوتيوب الخاص
        uses: actions/checkout@v4
        with:
          repository: gilandeya/trendnews-data
          token: ${{ secrets.YOUTUBE_DATA_TOKEN }}
          path: youtube-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: القياس
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRENDNEWS_YOUTUBE_POINTS_DIR: ${{ github.workspace }}/youtube-data/state/youtube_points
        run: |
          if [ -n "${{ inputs.model }}" ]; then
            python tools/gemini_probe.py --model "${{ inputs.model }}"
          else
            python tools/gemini_probe.py
          fi

      - name: رفع الردود إلى المستودع الخاص
        if: always()
        working-directory: youtube-data
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git symbolic-ref --short HEAD)"
          mkdir -p gemini_probe && git add gemini_probe
          git diff --quiet --cached && exit 0
          git commit -m "chore(gemini): قياس $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 7))
          done
          exit 1

      - name: رفع الأرقام وحدها إلى المستودع العام
        if: always()
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state/gemini_probe && git add state/gemini_probe
          git diff --quiet --cached && exit 0
          git commit -m "chore(gemini): تقرير القياس"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 7))
          done
          exit 1
