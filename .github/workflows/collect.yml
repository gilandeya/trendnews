name: 1️⃣ جمع الأخبار وتوليد المسودات

on:
  schedule:
    # 13 موعدًا بتوقيت إسطنبول (UTC+3)، مسودة واحدة في كل مرة:
    #   08 · 10 · 12 · 14 · 16 · 18 · 19 · 20 · 21 · 22 · 23 · 01 · 06:30
    # المساء مكثّف لأنه ذروة التفاعل العربي.
    - cron: "0 5,7,9,11,13,15,16,17,18,19,20,22 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "عدد المسودات المطلوبة"
        required: false
        default: "1"
      check_sources:
        description: "فحص المصادر فقط بلا توليد مسودات"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: trendnews-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: التأكد من الخطوط العربية
        run: bash scripts/fetch_fonts.sh

      - name: فحص المصادر
        if: inputs.check_sources == true
        run: python -m src.check_sources

      - name: توليد المسودات
        if: inputs.check_sources != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.collect --limit "${{ inputs.limit || '1' }}"

      - name: رفع المسودات إلى المستودع
        id: commit
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "لا مسودات جديدة"
          else
            git commit -m "chore(drafts): مسودات $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: نسخة احتياطية من الصور (تُنزّل إن كان المستودع خاصًا)
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_id }}
          path: drafts/
          retention-days: 14
          if-no-files-found: ignore

      - name: فتح Issue للمراجعة
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.open_review

      - name: تثبيت رقم الـ Issue في المسودات
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p drafts
          git add -A drafts
          if ! git diff --quiet --cached; then
            git commit -m "chore(drafts): ربط المسودات بـ Issue المراجعة"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
