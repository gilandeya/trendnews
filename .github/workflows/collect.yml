name: 1️⃣ جمع الأخبار وتوليد المسودات

on:
  # ⏰ الجدولة الداخلية معطّلة — جدولة GitHub المجانية بلا ضمان،
  #    وكانت تُسقط المواعيد. البديل: استدعاء workflow_dispatch
  #    من cron-job.org، وهو يُنفَّذ فورًا دائمًا.
  #    المواعيد يديرها cron-job.org: 01 · 06 · 08 · 10 · 12 · 14 · 16
  #   18 · 19 · 20 · 21 · 22 · 23 بتوقيت إسطنبول
  workflow_dispatch:
    inputs:
      limit:
        description: "عدد المسودات المطلوبة"
        required: false
        default: "1"
      check_sources:
        description: "فحص المصادر فقط بلا توليد مسودات"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: trendnews-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: التأكد من الخطوط العربية
        run: bash scripts/fetch_fonts.sh

      - name: فحص المصادر
        if: inputs.check_sources == true
        run: python -m src.check_sources

      - name: توليد المسودات
        if: inputs.check_sources != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.collect --limit "${{ inputs.limit || '1' }}"

      - name: رفع المسودات إلى المستودع
        id: commit
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "لا مسودات جديدة"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(drafts): مسودات $(date -u '+%Y-%m-%d %H:%M') UTC"
          # إعادة المحاولة: سيّرا الجمع والرادار قد يدفعان في اللحظة نفسها،
          # فيرفض GitHub أحدهما بخطأ Internal Server Error. الالتزام محفوظ
          # محليًا، فيكفي إعادة السحب والدفع.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ رُفع في المحاولة $attempt"
              exit 0
            fi
            echo "⚠️ فشل الدفع (محاولة $attempt) — إعادة بعد $((attempt * 7))ث"
            sleep $((attempt * 7))
          done
          echo "❌ تعذّر الدفع بعد 5 محاولات"
          exit 1

      - name: نسخة احتياطية من الصور (تُنزّل إن كان المستودع خاصًا)
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_id }}
          path: drafts/
          retention-days: 14
          if-no-files-found: ignore

      - name: فتح Issue للمراجعة
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.open_review

      - name: تثبيت رقم الـ Issue في المسودات
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            exit 0
          fi
          git commit -m "chore(drafts): ربط المسودات بـ Issue المراجعة"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 7))
          done
          echo "⚠️ تعذّر رفع رقم الـ Issue — المسودات محفوظة"
