name: 🚨 رادار العاجل

on:
  # ⏰ الجدولة الداخلية معطّلة — جدولة GitHub المجانية بلا ضمان،
  #    وكانت تُسقط المواعيد. البديل: استدعاء workflow_dispatch
  #    من cron-job.org، وهو يُنفَّذ فورًا دائمًا.
  #    كل ربع ساعة — يديرها cron-job.org
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فحص فقط بلا صياغة (مجاني تمامًا)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: trendnews-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: التأكد من الخطوط العربية
        run: bash scripts/fetch_fonts.sh

      - name: الفحص
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.radar --dry-run
          else
            python -m src.radar
          fi

      - name: حفظ الحالة
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if ! git diff --quiet --cached; then
            git commit -m "chore(radar): التقاط عاجل $(date -u '+%H:%M') UTC"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
