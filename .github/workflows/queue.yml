name: 3️⃣ نشر الطابور في وقته

on:
  # الجدولة الداخلية معطّلة — جدولة GitHub المجانية كانت تُسقط المواعيد.
  # البديل: استدعاء خارجي من cron-job.org كل 15 دقيقة.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      show_only:
        description: "عرض الطابور بلا نشر"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: trendnews-queue
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: عرض الطابور
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m src.publish --queue

      - name: نشر المستحق
        if: inputs.show_only != true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m src.publish --due

      - name: تسجيل الحالة
        if: inputs.show_only != true
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            echo "لا تغييرات"
            exit 0
          fi
          git commit -m "chore(drafts): نشر الطابور"
          # إعادة المحاولة: سيّرا الجمع والرادار قد يدفعان في اللحظة نفسها،
          # فيرفض GitHub أحدهما بخطأ Internal Server Error. الالتزام محفوظ
          # محليًا، فيكفي إعادة السحب والدفع.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ رُفع في المحاولة $attempt"
              exit 0
            fi
            echo "⚠️ فشل الدفع (محاولة $attempt) — إعادة بعد $((attempt * 7))ث"
            sleep $((attempt * 7))
          done
          echo "❌ تعذّر الدفع بعد 5 محاولات"
          exit 1
