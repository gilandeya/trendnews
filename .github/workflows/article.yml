name: مقال من المصادر

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: trendnews-article-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  article:
    if: github.event.label.name == 'مقال'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تحقق من صلاحية من أضاف الوسم
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          perm=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('permission',''))")
          echo "صلاحية ${ACTOR} على ${REPO}: ${perm:-تعذّر الاستعلام}"
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "❌ ${ACTOR} لا يملك صلاحية كتابة كافية لتشغيل مسار يكتب في المستودع"
              exit 1
              ;;
          esac

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: التأكد من الخطوط العربية
        run: bash scripts/fetch_fonts.sh

      - name: كتابة المقال
        id: article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BASELINE_ISSUE=$(python3 -c "from src.config import load_config; print(load_config().path('article.baseline_issue_number') or '')")
          if [ "$ISSUE_NUMBER" = "$BASELINE_ISSUE" ]; then
            echo "▶ تشغيل خط الأساس على Issue #$ISSUE_NUMBER"
            python -m src.article --issue "$ISSUE_NUMBER" --baseline
          else
            python -m src.article --issue "$ISSUE_NUMBER"
          fi

      - name: رفع المسودة إلى المستودع
        id: commit
        if: steps.article.outputs.draft_id != '' || steps.article.outputs.baseline == 'true'
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "لا مسودة جديدة"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(article): مقال من المصادر لـ Issue #${{ github.event.issue.number }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ رُفع في المحاولة $attempt"
              exit 0
            fi
            echo "⚠️ فشل الدفع (محاولة $attempt) — إعادة بعد $((attempt * 7))ث"
            sleep $((attempt * 7))
          done
          echo "❌ تعذّر الدفع بعد 5 محاولات"
          exit 1

      - name: فتح/تحديث Issue المراجعة
        if: steps.commit.outputs.changed == 'true' && steps.article.outputs.draft_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.open_review

      - name: تثبيت رقم Issue المراجعة في المسودة
        if: steps.commit.outputs.changed == 'true' && steps.article.outputs.draft_id != ''
        run: |
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            exit 0
          fi
          git commit -m "chore(drafts): ربط مسودة المقال بـ Issue المراجعة"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 7))
          done
          echo "⚠️ تعذّر رفع رقم الـ Issue — المسودة محفوظة"
