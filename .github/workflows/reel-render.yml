# قالب workflow لتركيب الريل (Issue #1381، R3b-1). لا يعمل من هنا: ينسخه صاحب المشروع بيده إلى
# .github/workflows/reel-render.yml (البوت لا يملك صلاحية تعديل ذلك المجلد).
# يتأكد صاحب المشروع من اسم فرع المستودع الخاص (يُقرأ تلقائيًا من HEAD) ومن reel.render.data_link_base في config.yaml.
name: 🎬 تركيب الريل

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trendnews-reel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: سحب مستودع بيانات يوتيوب الخاص
        uses: actions/checkout@v4
        with:
          repository: gilandeya/trendnews-data
          token: ${{ secrets.YOUTUBE_DATA_TOKEN }}
          path: youtube-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت Deno (لفك تشفير مشغّل يوتيوب)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: تثبيت ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: التركيب
        env:
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRENDNEWS_YOUTUBE_POINTS_DIR: ${{ github.workspace }}/youtube-data/state/youtube_points
          TRENDNEWS_REELS_DIR: ${{ github.workspace }}/youtube-data/reels
        run: python -m src.reel_render --pending

      - name: إيداع المسودات في هذا المستودع
        if: always()
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drafts state
          git diff --quiet --cached && exit 0
          git commit -m "chore(reel): حالة تركيب الريل"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 7))
          done
          exit 1

      - name: رفع الريلز إلى مستودع البيانات الخاص
        if: always()
        working-directory: youtube-data
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git symbolic-ref --short HEAD)"
          mkdir -p reels
          git add reels
          git diff --quiet --cached && exit 0
          git commit -m "chore(reel): ريلز مركَّبة $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 7))
          done
          exit 1
