name: 🎥 جمع واستخلاص يوتيوب (تجريبي)

on:
  workflow_dispatch: {}

# لا issues: write هنا — هذه المرحلة لا تفتح Issue مراجعة ولا تنشر، فقط
# تكتب ملف نقاط وسجل تكرار داخل state/.
permissions:
  contents: write

concurrency:
  group: trendnews-youtube-collect
  cancel-in-progress: false

jobs:
  collect-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: الجمع والاستخلاص
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
        run: python -m src.youtube_extract

      - name: رفع ملف النقاط وسجل التكرار
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/youtube_points state/youtube_seen.json
          if git diff --quiet --cached; then
            echo "لا تغييرات"
            exit 0
          fi
          git commit -m "chore(youtube): نقاط $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ رُفع في المحاولة $attempt"
              exit 0
            fi
            echo "⚠️ فشل الدفع (محاولة $attempt) — إعادة بعد $((attempt * 7))ث"
            sleep $((attempt * 7))
          done
          echo "❌ تعذّر الدفع بعد 5 محاولات"
          exit 1
