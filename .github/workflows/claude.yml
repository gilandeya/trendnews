name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: gilandeya
          claude_args: '--allowed-tools "Edit,MultiEdit,Write,ToolSearch,Bash(python *),Bash(python3 *),Bash(pip *),Bash(pip3 *),Bash(git *),Bash(gh issue list:*),Bash(gh issue view:*),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(find *),Bash(sort *),Bash(diff *),Bash(mkdir *),Bash(cp *),Bash(env -u GITHUB_TOKEN -u GITHUB_REPOSITORY -u GITHUB_REF_NAME python -m tests.test_pipeline)"'
          show_full_output: true
          additional_permissions: |
            actions: read
