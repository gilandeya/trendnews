name: 2️⃣ نشر المعتمد على فيسبوك

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "رقم Issue المراجعة (اتركه فارغًا مع ids)"
        required: false
      ids:
        description: "معرفات مسودات مفصولة بفواصل (نشر فوري)"
        required: false
      publish_now:
        description: "نشر فوري بلا جدولة"
        type: boolean
        required: false
        default: false
      verify_only:
        description: "فحص توكن فيسبوك فقط بلا نشر"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "فحص شامل لأسباب ضعف الوصول"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  # ── المسار السريع: العاجل وحده، بمجموعة تزامن خاصة ──
  # لا ينتظر خلف تشغيل عادٍ قد يستغرق ساعتين بين منشوراته.
  urgent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trendnews-publish-urgent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: فحص شامل للوصول
        if: inputs.diagnose == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m src.publish --diagnose

      - name: فحص توكن فيسبوك
        if: inputs.verify_only == true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m src.publish --verify

      - name: نشر العاجل فورًا
        if: inputs.verify_only != true && inputs.diagnose != true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.ids }}" ]; then
            python -m src.publish --ids "${{ inputs.ids }}"
          else
            ISSUE="${{ inputs.issue || github.event.issue.number }}"
            if [ "${{ inputs.publish_now }}" = "true" ]; then
              python -m src.publish --issue "$ISSUE" --now
            else
              python -m src.publish --issue "$ISSUE" --urgent-only
            fi
          fi

      # انهيار على مستوى C (double free مثلًا) يقتل العملية بلا استثناء
      # بايثون، فلا يصل أي تعليق للمراجع. هذه الخطوة تلتقط ذلك.
      - name: تبليغ فشل تقني (انهيار على مستوى C، لا استثناء بايثون)
        if: failure() && inputs.verify_only != true && inputs.diagnose != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ inputs.issue || github.event.issue.number }}"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body \
              "⚠️ انهارت خطوة النشر (exit code غير صفري — على الأرجح إشارة على مستوى C، لا استثناء بايثون؛ راجع سجل التشغيلة). لم يُسجَّل شيء؛ الاختيار ما يزال صالحًا لإعادة المحاولة."
          else
            echo "⚠️ فشل تقني بلا Issue مرتبط"
          fi

      - name: تسجيل الحالة
        if: always() && inputs.verify_only != true && inputs.diagnose != true
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            exit 0
          fi
          git commit -m "chore(drafts): نشر العاجل"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}" || true
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            sleep $((attempt * 7))
          done
          echo "⚠️ تعذّر تسجيل الحالة — المنشورات نُشرت"

  # ── المسار العادي: يبدأ بعد العاجل، ويتحمّل الانتظار الطويل ──
  normal:
    needs: urgent
    if: >-
      always() &&
      inputs.verify_only != true && inputs.diagnose != true &&
      inputs.ids == '' && inputs.publish_now != true &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: trendnews-publish-normal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: نشر العادي بفواصل
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE="${{ inputs.issue || github.event.issue.number }}"
          python -m src.publish --issue "$ISSUE" --skip-urgent

      - name: تبليغ فشل تقني (انهيار على مستوى C، لا استثناء بايثون)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ inputs.issue || github.event.issue.number }}"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body \
              "⚠️ انهارت خطوة النشر العادي (exit code غير صفري — إشارة على مستوى C، لا استثناء بايثون؛ راجع سجل التشغيلة). الاختيار ما يزال صالحًا لإعادة المحاولة."
          fi

      - name: تسجيل الحالة
        if: always()
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p drafts state
          git add -A drafts state
          if git diff --quiet --cached; then
            exit 0
          fi
          git commit -m "chore(drafts): نشر العادي"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}" || true
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            sleep $((attempt * 7))
          done
          echo "⚠️ تعذّر تسجيل الحالة — المنشورات نُشرت"
