name: 🧪 تجربة حَكَم «هام» (مؤقت)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "رقم الـIssue الذي فيه النص"
        required: true

permissions:
  contents: write
  issues: read

concurrency:
  group: trendnews-important-judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت المكتبات
        run: pip install -r requirements.txt
      - name: الحكم
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python -m src.important --issue ${{ inputs.issue }} --judge-only
      - name: حفظ النتيجة
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/important
          git diff --quiet --cached && exit 0
          git commit -m "chore(important): نتيجة تجربة الحَكَم #${{ inputs.issue }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 7))
          done
          exit 1
