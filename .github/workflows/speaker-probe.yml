name: 🧭 قياس خريطة المتكلمين
on:
  workflow_dispatch:
    inputs:
      args:
        description: "وسائط الأداة، مثل: --video qB_4P0mUCyI --video QFMGl1rCLhU --preview"
        required: true
permissions:
  contents: write
concurrency:
  group: trendnews-speaker-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gilandeya/trendnews-data
          token: ${{ secrets.YOUTUBE_DATA_TOKEN }}
          path: youtube-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt -r requirements-reel.txt opencv-python-headless
      - name: القياس
        env:
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/speaker_map_probe.py ${{ inputs.args }}
      - name: إيداع التقرير هنا
        if: always()
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/speaker_probe
          git diff --quiet --cached && exit 0
          git commit -m "chore(probe): تقرير خريطة المتكلمين"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 7))
          done
          exit 1
      - name: إيداع المعاينة في المستودع الخاص
        if: always()
        working-directory: youtube-data
        run: |
          git config user.name  "trendnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git symbolic-ref --short HEAD)"
          mkdir -p speaker_probe
          git add speaker_probe
          git diff --quiet --cached && exit 0
          git commit -m "chore(probe): معاينة وجوه المجموعات"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 7))
          done
          exit 1
